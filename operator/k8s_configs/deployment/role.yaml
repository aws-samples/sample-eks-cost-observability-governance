apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cost-governance-operator
  labels:
    app: cost-governance-operator
rules:
# CostGovernance CRD permissions
- apiGroups:
  - cost-governance.io
  resources:
  - costgovernances
  verbs:
  - get
  - list
  - watch
  - patch
  - update

- apiGroups:
  - cost-governance.io
  resources:
  - costgovernances/status
  verbs:
  - get
  - patch
  - update

# ViolationReport CRD permissions
- apiGroups:
  - cost-governance.io
  resources:
  - violationreports
  verbs:
  - create
  - delete
  - get
  - list
  - watch

- apiGroups:
  - cost-governance.io
  resources:
  - violationreports/status
  verbs:
  - get
  - patch
  - update

# Read pods for cost/utilization tracking
- apiGroups:
  - ""
  resources:
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch

# Read deployments/statefulsets for metadata
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - replicasets
  - daemonsets
  verbs:
  - get
  - list
  - watch

# Read ConfigMaps for registry data
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch

# Events for operator notifications
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch

# Kopf operator framework requirements
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - list
  - watch

- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - list
  - watch
