apiVersion: v1
kind: Service
metadata:
  name: cost-governance-operator
  namespace: cost-governance-system
  labels:
    app: cost-governance-operator
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: cost-governance-operator
  ports:
  - name: metrics
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: health
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
