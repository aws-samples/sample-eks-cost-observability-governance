apiVersion: cost-governance.io/v1alpha1
kind: CostGovernance
metadata:
  name: default-governance
  namespace: cost-governance-system
spec:
  # Enforcement mode: audit or enforce
  enforcementMode: audit

  # Required cost attribution labels
  requiredLabels:
    - cost-center
    - business-unit
    - team
    - application
    - environment

  # Resource thresholds for high-cost workloads
  resourceThresholds:
    cpu: "4"
    memory: "16Gi"
    requiresGpuApproval: true

  # Reference to registry ConfigMap
  registryConfigMap:
    name: cost-governance-registry
    namespace: cost-governance-system

  # Cron schedule for cost collection (daily at 6am UTC)
  collectionSchedule: "0 6 * * *"
