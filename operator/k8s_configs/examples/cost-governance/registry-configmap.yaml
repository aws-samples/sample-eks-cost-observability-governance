apiVersion: v1
kind: ConfigMap
metadata:
  name: cost-governance-registry
  namespace: cost-governance-system
  labels:
    app: cost-governance
data:
  registry.yaml: |
    # Cost Governance Registry
    # Defines valid values for cost attribution labels


    business-units:
      - id: Acme-Data-Platform
        cost-centers:
          - ADP1001
          - CC-1235
        teams:
          - name: platform
            namespaces:
              - cost-governance-system
              - monitoring
              - platform-*

      - id: product
        cost-centers:
          - CC-2100
          - CC-2101
        teams:
          - name: product-api-team
            namespaces:
              - product-api-*
          - name: product-web-team
            namespaces:
              - product-web-*

      - id: sales
        cost-centers:
          - CC-3000
        teams:
          - name: sales-analytics-team
            namespaces:
              - sales-*

    # Valid environment values (global, not per business unit)
    environments:
      - development
      - staging
      - production

    # Infrastructure namespace classification
    # Namespaces listed here are treated as cluster infrastructure (not application workloads)
    infrastructure-namespaces:
      kube-system: platform
      monitoring: observability
      karpenter: operations
      cost-governance-system: governance
