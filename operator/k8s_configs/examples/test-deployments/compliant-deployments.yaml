# Test Deployments for compliance checking
# These are fully compliant deployments with proper cost attribution labels

---
# Namespace for test deployments
apiVersion: v1
kind: Namespace
metadata:
  name: test-apps
  annotations:
    cost-governance.io/allowed-cost-centers: "CC-1234,CC-1235,CC-1236,CC-2001,CC-2002,CC-2100,CC-3000"

---
# ✅ COMPLIANT DEPLOYMENT - Engineering Platform Team
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: test-apps
  labels:
    app: api-service
    cost-center: "CC-1234"
    business-unit: "engineering"
    team: "platform-team"
    application: "api-service"
    environment: "prod"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
        cost-center: "CC-1234"
        business-unit: "engineering"
        team: "platform-team"
        application: "api-service"
        environment: "prod"
    spec:
      containers:
      - name: api
        image: nginx:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

---
# ✅ COMPLIANT DEPLOYMENT - Engineering Data Team (Staging)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processor
  namespace: test-apps
  labels:
    app: data-processor
    cost-center: "CC-1235"
    business-unit: "engineering"
    team: "data-team"
    application: "data-processor"
    environment: "staging"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-processor
  template:
    metadata:
      labels:
        app: data-processor
        cost-center: "CC-1235"
        business-unit: "engineering"
        team: "data-team"
        application: "data-processor"
        environment: "staging"
    spec:
      containers:
      - name: processor
        image: busybox:latest
        command: ["sh", "-c", "while true; do echo 'Processing data...'; sleep 30; done"]
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

---
# ✅ COMPLIANT DEPLOYMENT - Product API Team (Production)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
  namespace: test-apps
  labels:
    app: product-api
    cost-center: "CC-2100"
    business-unit: "product"
    team: "product-api-team"
    application: "product-api"
    environment: "prod"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: product-api
  template:
    metadata:
      labels:
        app: product-api
        cost-center: "CC-2100"
        business-unit: "product"
        team: "product-api-team"
        application: "product-api"
        environment: "prod"
    spec:
      containers:
      - name: api
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

---
# ✅ COMPLIANT DEPLOYMENT - Engineering ML Team (Dev)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-training
  namespace: test-apps
  labels:
    app: ml-training
    cost-center: "CC-1236"
    business-unit: "engineering"
    team: "ml-team"
    application: "ml-training"
    environment: "dev"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-training
  template:
    metadata:
      labels:
        app: ml-training
        cost-center: "CC-1236"
        business-unit: "engineering"
        team: "ml-team"
        application: "ml-training"
        environment: "dev"
    spec:
      containers:
      - name: trainer
        image: python:3.11-slim
        command: ["python", "-c", "import time; time.sleep(3600)"]
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

---
# ✅ COMPLIANT DEPLOYMENT - Sales Analytics Team
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-dashboard
  namespace: test-apps
  labels:
    app: sales-dashboard
    cost-center: "CC-3000"
    business-unit: "sales"
    team: "sales-analytics-team"
    application: "sales-dashboard"
    environment: "prod"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sales-dashboard
  template:
    metadata:
      labels:
        app: sales-dashboard
        cost-center: "CC-3000"
        business-unit: "sales"
        team: "sales-analytics-team"
        application: "sales-dashboard"
        environment: "prod"
    spec:
      containers:
      - name: dashboard
        image: nginx:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

---
# Service for product-api (optional - demonstrates full app setup)
apiVersion: v1
kind: Service
metadata:
  name: product-api
  namespace: test-apps
  labels:
    cost-center: "CC-2100"
    business-unit: "product"
    team: "product-api-team"
    application: "product-api"
    environment: "prod"
spec:
  selector:
    app: product-api
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
