# Static ValidatingWebhookConfiguration for enforce mode.
#
# Applied once and owned by us (NOT managed by Kopf), so it survives operator
# restarts. Do NOT apply this file directly -- gen-certs.sh substitutes the
# caBundle token with the real base64 CA before applying (a literal placeholder
# would fail kubectl's base64 validation).
#
# failurePolicy: Ignore keeps the cluster safe: if the operator is down or
# unreachable, pod creation still succeeds (fail-open) rather than being blocked.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: cost-governance.io
  labels:
    app: cost-governance-operator
webhooks:
- name: enforce-pod-labels.cost-governance.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Ignore
  timeoutSeconds: 5
  matchPolicy: Equivalent
  clientConfig:
    service:
      name: cost-governance-operator
      namespace: cost-governance-system
      port: 9443
      path: /enforce-pod-labels
    caBundle: "${CA_BUNDLE}"
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
    scope: Namespaced
  # Never intercept system or operator namespaces, so control-plane and the
  # operator's own workloads can always start even in enforce mode.
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
      - kube-public
      - kube-node-lease
      - cost-governance-system
